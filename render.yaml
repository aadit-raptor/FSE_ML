# Render Blueprint for the API. In Render: New > Blueprint > pick this repo.
# The web app is on Vercel and proxies /api here (see DEPLOY.md).
#
# Production only. Staging is a second free web service, fse-api-staging,
# created by hand in the dashboard with the same Dockerfile and health check
# but deploying from the `staging` branch. It isn't listed here so a blueprint
# sync can't create a duplicate of it. /api/health tells the two apart
# (environment comes from RENDER_SERVICE_NAME, commit from RENDER_GIT_COMMIT).
services:
  - type: web
    name: fse-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # free sleeps after ~15 min idle (first request then waits for a cold
    # start); starter stays awake
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    # Rebuild only when the API or model code changes, not for web/ or docs
    buildFilter:
      paths:
        - Dockerfile
        - requirements*.txt
        - analytics/**
        - api/**
        - benchmarks/**
        - companies/**
        - core/**
        - db/**
        - economy/**
        - jobs/**
        - lbo_engine/**
        - library/**
        - ml/**
        - research/**
        - simulation/**
        - teams/**
        - uploads/**
        - validation/**
        - web/messages/**
    envVars:
      # Teams (PLAN.md 7.2, DEPLOY.md "Teams"): Clerk's secret key reads a
      # teammate's name for a team's screens and a mentioned person's address
      # for their email, never stored; Resend sends those emails, from
      # FSE_MAIL_FROM, linking to FSE_APP_URL. Unset = no names shown, and
      # mentions wait until set (dropped after a week)
      - key: CLERK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FSE_MAIL_FROM
        sync: false
      - key: FSE_APP_URL
        sync: false
      # Browser origins allowed to call the API directly. The web app goes
      # through Vercel's proxy, so this only matters for direct API use.
      - key: FSE_CORS_ORIGINS
        sync: false
      # Neon pooled connection string, production branch (staging's service
      # uses the staging branch). Unset = the API runs without a database.
      - key: DATABASE_URL
        sync: false
      # Upstash Redis REST URL and token: shared usage counters (PLAN.md 1.6).
      # Unset = counters shared through the database, or kept in memory
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Economic data (PLAN.md 4.2): SOFR, SONIA and the US 10-year yield from
      # FRED; unset = SOFR and SONIA fall back to the policy rates
      - key: FRED_API_KEY
        sync: false
      # Company filings (PLAN.md 4.1): UK Companies House and Japan's EDINET.
      # Unset = those two sources are listed as not set up; SEC EDGAR and
      # ESEF need no key
      - key: COMPANIES_HOUSE_API_KEY
        sync: false
      - key: EDINET_API_KEY
        sync: false
      # File uploads (PLAN.md 6.1): the Supabase project that holds uploaded
      # files and its secret key (DEPLOY.md "File uploads"). Not the backups'
      # project: this key can delete everything in its project. Unset = the
      # Documents screen says uploads are not set up. The website needs
      # nothing new: uploads go to this API's own address
      - key: SUPABASE_UPLOADS_URL
        sync: false
      - key: SUPABASE_UPLOADS_KEY
        sync: false
      # The results reader (PLAN.md R1, DEPLOY.md "Results reader"): AI_PROVIDER
      # gemini and its key (Google project variater-reader, free tier until
      # billing with a cap is switched on before outside users). Unset = the
      # reader says it is off. AI_FREE_TIER defaults on: every read asks the
      # person to confirm the file is public; set 0 only on a paid key
      - key: AI_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
