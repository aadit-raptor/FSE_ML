# Dependabot (PLAN.md 1.7): weekly update PRs for every package manager in
# the repository, grouped so a week's updates are one PR per ecosystem.
# Security updates come separately as soon as an advisory is published
# (turned on in the repository's Settings > Advanced Security).
# Each PR runs the full CI like any other change. Titles read
# "chore(deps): Bump ...", which the PR title check (pr.yml) accepts.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      web:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 2
    # Patch updates of the base image only: a new Python version (3.12 to
    # 3.14) changes what torch, scikit-learn and the saved models run on, so
    # it is a planned task, not a weekly bump
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
