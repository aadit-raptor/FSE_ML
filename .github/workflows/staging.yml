name: staging

# After every push to `staging`, wait until both staging copies run that
# commit, then run the read-only browser checks (web/e2e/live.spec.ts) against
# the Vercel preview built from it. Staging = Render service fse-api-staging
# (deploys from `staging`) + the Vercel preview of the same commit, which
# next.config.ts points at the staging API. See DEPLOY.md.
#
# Alerts (PLAN.md 1.2): staging has no scheduled uptime check (that would
# keep the free service awake), so this workflow is its monitor. A quick API
# check runs as soon as the new commit is live; if it fails, a Better Stack
# incident (email) is raised straight away, and the browser checks still run
# so the failure is also reported from the browser. Any other failure raises
# an incident at the end.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

env:
  STAGING_API: https://fse-api-staging.onrender.com
  # Keep in step with buildFilter in render.yaml: if none of these changed
  # since the commit staging runs, that API is already equivalent to this one
  API_PATHS: Dockerfile requirements*.txt analytics api core db lbo_engine ml simulation

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the preview bypass secret is set
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Add the GitHub Actions secret VERCEL_AUTOMATION_BYPASS_SECRET (Vercel > fse-ml > Settings > Deployment Protection > Protection Bypass for Automation). DEPLOY.md explains."
            exit 1
          fi

      - name: Wait for the staging API to run this commit
        run: |
          # Free Render builds take a few minutes; a sleeping service about a minute to wake
          for i in $(seq 1 60); do
            health=$(curl -fsS -m 90 "$STAGING_API/api/health" || true)
            env=$(echo "$health" | jq -r '.environment // empty' 2>/dev/null || true)
            commit=$(echo "$health" | jq -r '.commit // empty' 2>/dev/null || true)
            echo "attempt $i: environment=${env:-?} commit=${commit:-?}"
            if [ "$env" = "staging" ] && [ -n "$commit" ]; then
              if [ "$commit" = "$GITHUB_SHA" ]; then
                echo "Staging API runs $GITHUB_SHA"; exit 0
              fi
              if git cat-file -e "$commit^{commit}" 2>/dev/null \
                 && git merge-base --is-ancestor "$commit" "$GITHUB_SHA" \
                 && git diff --quiet "$commit" "$GITHUB_SHA" -- $API_PATHS; then
                echo "Staging API runs $commit; no API changes since, so it matches $GITHUB_SHA"; exit 0
              fi
            fi
            sleep 20
          done
          echo "::error::The staging API did not deploy $GITHUB_SHA within 20 minutes"; exit 1

      - name: Quick API check (deal model, request ID)
        id: smoke
        continue-on-error: true
        run: |
          curl -fsS -m 120 -D headers.txt -o deal.json -X POST "$STAGING_API/api/deal/run" -H 'Content-Type: application/json' -H "X-Request-ID: staging-$GITHUB_RUN_ID" -d '{}'
          grep -i "^x-request-id: staging-$GITHUB_RUN_ID" headers.txt
          irr=$(python3 -c "import json; print(round(json.load(open('deal.json'))['returns']['irr'], 4))")
          echo "default deal IRR $irr"; test "$irr" = "0.2116"
          # Neon staging branch: reachable, migrations applied, storage under 80% (PLAN.md 1.3)
          python3 ops/check_database.py "$STAGING_API"

      - name: Alert now if the API check failed
        if: steps.smoke.outcome == 'failure'
        env:
          BETTERSTACK_API_TOKEN: ${{ secrets.BETTERSTACK_API_TOKEN }}
        run: |
          python3 ops/betterstack.py incident --name "Staging API broken" --summary "Staging API check failed for ${GITHUB_SHA::7} (request ID staging-$GITHUB_RUN_ID): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Wait for the Vercel preview of this commit
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&environment=Preview" --jq '.[0].id // empty')
            if [ -n "$id" ]; then
              read -r state url < <(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0] | "\(.state) \(.environment_url // .target_url)"')
              echo "attempt $i: $state $url"
              if [ "$state" = "success" ]; then echo "url=$url" >> "$GITHUB_OUTPUT"; exit 0; fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then echo "::error::Vercel preview build failed"; exit 1; fi
            else
              echo "attempt $i: no preview deployment yet"
            fi
            sleep 20
          done
          echo "::error::No Vercel preview for $GITHUB_SHA within 20 minutes"; exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser checks against staging
        working-directory: web
        run: npm run test:live
        env:
          E2E_LIVE: "1"
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          E2E_EXPECT_ENV: staging
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Fail the run if the API check failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1

      - name: Alert on any other failure
        if: failure() && steps.smoke.outcome != 'failure'
        env:
          BETTERSTACK_API_TOKEN: ${{ secrets.BETTERSTACK_API_TOKEN }}
        run: |
          python3 ops/betterstack.py incident --name "Staging checks failed" --summary "Staging checks failed for ${GITHUB_SHA::7}: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
