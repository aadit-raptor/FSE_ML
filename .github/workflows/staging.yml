name: staging

# After every push to `staging`, wait until both staging copies run that
# commit, then run the read-only browser checks (web/e2e/live.spec.ts) against
# the Vercel preview built from it. Staging = Render service fse-api-staging
# (deploys from `staging`) + the Vercel preview of the same commit, which
# next.config.ts points at the staging API. See DEPLOY.md.
#
# Alerts (PLAN.md 1.2): staging has no scheduled uptime check (that would
# keep the free service awake), so this workflow is its monitor. A quick API
# check runs as soon as the new commit is live; if it fails, a Better Stack
# incident (email) is raised straight away, and the browser checks still run
# so the failure is also reported from the browser. Any other failure raises
# an incident at the end.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read
  # Only to prove to the staging API that this workflow is calling (the job
  # drill below, api/github_oidc.py); the repository token stays read-only
  id-token: write

env:
  STAGING_API: https://fse-api-staging.onrender.com
  # Keep in step with buildFilter in render.yaml: if none of these changed
  # since the commit staging runs, that API is already equivalent to this one
  API_PATHS: Dockerfile requirements*.txt analytics api benchmarks companies core db economy jobs lbo_engine library ml simulation validation

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the preview bypass secret is set
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Add the GitHub Actions secret VERCEL_AUTOMATION_BYPASS_SECRET (Vercel > fse-ml > Settings > Deployment Protection > Protection Bypass for Automation). DEPLOY.md explains."
            exit 1
          fi

      - name: Wait for the staging API to run this commit
        run: |
          # Free Render builds take a few minutes; a sleeping service about a minute to wake
          for i in $(seq 1 60); do
            health=$(curl -fsS -m 90 "$STAGING_API/api/health" || true)
            env=$(echo "$health" | jq -r '.environment // empty' 2>/dev/null || true)
            commit=$(echo "$health" | jq -r '.commit // empty' 2>/dev/null || true)
            echo "attempt $i: environment=${env:-?} commit=${commit:-?}"
            if [ "$env" = "staging" ] && [ -n "$commit" ]; then
              if [ "$commit" = "$GITHUB_SHA" ]; then
                echo "Staging API runs $GITHUB_SHA"; exit 0
              fi
              if git cat-file -e "$commit^{commit}" 2>/dev/null \
                 && git merge-base --is-ancestor "$commit" "$GITHUB_SHA" \
                 && git diff --quiet "$commit" "$GITHUB_SHA" -- $API_PATHS; then
                echo "Staging API runs $commit; no API changes since, so it matches $GITHUB_SHA"; exit 0
              fi
            fi
            sleep 20
          done
          echo "::error::The staging API did not deploy $GITHUB_SHA within 20 minutes"; exit 1

      - name: Quick API check (sign-in enforced, request ID, database)
        id: smoke
        continue-on-error: true
        run: |
          # Since PLAN.md 1.4 the model needs an account, so the check that
          # can be made without one is that it is refused -- and that the
          # request ID still comes back on a refusal
          code=$(curl -s -m 120 -D headers.txt -o deal.json -w '%{http_code}' -X POST "$STAGING_API/api/deal/run" -H 'Content-Type: application/json' -H "X-Request-ID: staging-$GITHUB_RUN_ID" -d '{}')
          echo "anonymous /api/deal/run -> $code"; test "$code" = "401"
          grep -i "^x-request-id: staging-$GITHUB_RUN_ID" headers.txt
          ! grep -q irr deal.json
          # Clerk is configured there, so the development sign-in must be off
          code=$(curl -s -m 120 -o /dev/null -w '%{http_code}' -X POST "$STAGING_API/api/deal/run" -H 'Authorization: Bearer dev:ci' -H 'Content-Type: application/json' -d '{}')
          echo "development token -> $code"; test "$code" = "401"
          # Neon staging branch: reachable, migrations applied, storage under 80% (PLAN.md 1.3)
          python3 ops/check_database.py "$STAGING_API" --require-restricted-role
          # Usage counters shared through Upstash, which answers (PLAN.md 1.6)
          curl -fsS -m 120 "$STAGING_API/api/health/limits" | tee limits.json; echo
          jq -e '.store == "upstash" and .upstash.reachable and (.upstash.over_budget | not)' limits.json

      - name: Alert now if the API check failed
        if: steps.smoke.outcome == 'failure'
        env:
          BETTERSTACK_API_TOKEN: ${{ secrets.BETTERSTACK_API_TOKEN }}
        run: |
          python3 ops/betterstack.py incident --name "Staging API broken" --summary "Staging API check failed for ${GITHUB_SHA::7} (request ID staging-$GITHUB_RUN_ID): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Wait for the Vercel preview of this commit
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&environment=Preview" --jq '.[0].id // empty')
            if [ -n "$id" ]; then
              read -r state url < <(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0] | "\(.state) \(.environment_url // .target_url)"')
              echo "attempt $i: $state $url"
              if [ "$state" = "success" ]; then echo "url=$url" >> "$GITHUB_OUTPUT"; exit 0; fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then echo "::error::Vercel preview build failed"; exit 1; fi
            else
              echo "attempt $i: no preview deployment yet"
            fi
            sleep 20
          done
          echo "::error::No Vercel preview for $GITHUB_SHA within 20 minutes"; exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Security headers, content security policy and CORS (PLAN.md 1.7). The
      # bypass secret goes only to the preview URL: the scan follows no redirects
      - name: Header scan of staging
        run: python3 ops/check_headers.py --web "${{ steps.preview.outputs.url }}" --api "$STAGING_API"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Browser checks against staging
        working-directory: web
        run: npm run test:live
        env:
          E2E_LIVE: "1"
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          E2E_EXPECT_ENV: staging
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # Economic data (PLAN.md 4.2): refreshed on every staging deploy as well
      # as nightly, so a change to a connector meets the real sources before
      # it reaches production; checked with the job drill's health read below
      # The task's own answer (printed by ops.scheduled) must show at least
      # 20 economies current and exchange rates published within the last
      # seven days (the ECB publishes on TARGET days only: Easter closes four
      # in a row)
      - name: Economic data refresh on staging
        run: |
          set -o pipefail
          python3 -m ops.scheduled task economy-refresh --api "$STAGING_API" --environment staging | tee refresh.log
          sed -n 's/^task economy-refresh: succeeded //p' refresh.log > refresh.json
          jq -e --arg since "$(date -u -d '7 days ago' +%F)" '.economies_current >= 20 and .fx_date >= $since' refresh.json

      # Industry averages (PLAN.md 4.3): the 41 tables new deals start from.
      # Read again only when a week old, so most deploys answer what is stored;
      # the task's own answer must show every table and every industry. The
      # history the risk ranges read (PLAN.md 4.4) must be complete: every
      # group's archive read and the economic history of 20+ economies
      - name: Industry averages refresh on staging
        run: |
          set -o pipefail
          python3 -m ops.scheduled task benchmarks-refresh --repeat 24 --api "$STAGING_API" --environment staging | tee benchmarks.log
          sed -n 's/^task benchmarks-refresh: succeeded //p' benchmarks.log | tail -n 1 > benchmarks.json
          jq -e '.tables_stored == 41 and .industries >= 80 and .tables_missing == "" and .history_groups == 8 and .history_left == 0 and .macro_economies >= 20' benchmarks.json

      # Model validation (PLAN.md 4.6): the report is written on every
      # deploy, with all three checks and all four splits
      - name: Model validation report on staging
        run: |
          set -o pipefail
          python3 -m ops.scheduled task validation-report --api "$STAGING_API" --environment staging | tee validation.log
          sed -n 's/^task validation-report: succeeded //p' validation.log | tail -n 1 > validation.json
          jq -e '.checks == 3 and .splits == 4 and .report_id >= 1' validation.json

      # Background jobs (PLAN.md 1.9): ten seeded simulations queued at once
      # must all finish with the pinned result while /api/health keeps
      # answering; the run is recorded as job-drill in /api/health/jobs
      - name: Job drill on staging
        run: |
          python3 -m ops.scheduled drill --api "$STAGING_API" --environment staging
          curl -fsS -m 120 "$STAGING_API/api/health/jobs" | tee jobs.json; echo
          jq -e '.queue == "database" and .runner == "api" and .scheduled["job-drill"].status == "succeeded"' jobs.json

      - name: Fail the run if the API check failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1

      - name: Alert on any other failure
        if: failure() && steps.smoke.outcome != 'failure'
        env:
          BETTERSTACK_API_TOKEN: ${{ secrets.BETTERSTACK_API_TOKEN }}
        run: |
          python3 ops/betterstack.py incident --name "Staging checks failed" --summary "Staging checks failed for ${GITHUB_SHA::7}: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
