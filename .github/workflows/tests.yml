name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg   # no display on CI runners

jobs:
  core:
    # Core install only: proves the app and its tests work without the
    # optional ML layer (test_ml.py skips here).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -rs

  web:
    # Next.js frontend: lint, types (incl. the generated API client) and a
    # production build. The OpenAPI snapshot itself is checked by the core job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types match web/openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    # Browser tests: start the API and the built web app, drive the real UI
    # and check that each control changes its output (web/e2e/).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright test
        working-directory: web
        env:
          CI: "1"
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  ml:
    # Optional ML layer: runs the anomaly-detector and surrogate tests.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # CPU-only torch first: the default Linux wheel pulls several GB of CUDA
      # libraries. requirements-ml.txt then sees torch already satisfied.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # requirements-dev.txt brings pytest and httpx (the FastAPI test client)
      - run: pip install -r requirements-ml.txt -r requirements-dev.txt
      - name: Run all tests, failing if any ML test skips
        # shell: bash adds pipefail, so a pytest failure isn't masked by tee
        shell: bash
        run: |
          pytest -rs | tee pytest.log
          if grep -q SKIPPED pytest.log; then
            echo "::error::ML tests skipped -- dependencies or model files missing"
            exit 1
          fi
