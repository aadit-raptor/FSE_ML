name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The workflow token can only read the code (PLAN.md 1.7)
permissions:
  contents: read

jobs:
  core:
    # Core install only: proves the app and its tests work without the
    # optional ML layer (test_ml.py skips here).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Postgres for tests/test_database.py (migrations both ways, the
    # health check, recovery after the database drops every connection).
    # Neon runs Postgres 18. FSE_REQUIRE_DB turns a skipped database test into a failure.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      FSE_REQUIRE_DB: "1"
      # tests/test_limits.py's round trip against real Upstash (a few commands
      # a run, keys under fse:ci:, expiring within two days)
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The public repository needs no token to fetch the base branch's floor
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # tests/test_backups.py dumps and restores a real database (PLAN.md 1.8).
      # pg_dump refuses a server newer than itself and the runner image ships
      # an older client, so install PGDG's newest, as backup.yml does.
      - name: Newest Postgres client, for the backup tests
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_dump --version
      - run: pip install -r requirements-dev.txt
      - run: pytest -rs --cov --cov-report=
      # PLAN.md 0.3: the report goes in the job summary, and the total must
      # stay at or above this job's line in .coverage-floor, which may only
      # rise (compared with the base branch's copy on a pull request)
      - name: Coverage against the floor
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          coverage json -q -o coverage.json
          { echo "<details><summary>Python coverage (core): $(coverage report --format=total)%</summary>"; echo
            coverage report --format=markdown; echo; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          : > base-floor.txt
          if [ -n "$BASE_REF" ]; then
            git fetch -q --no-tags --depth=1 origin "$BASE_REF"
            # Only a base branch without the file skips the rise check; any
            # other git failure fails the step (bash -e)
            if [ -n "$(git ls-tree --name-only FETCH_HEAD -- .coverage-floor)" ]; then
              git show FETCH_HEAD:.coverage-floor > base-floor.txt
            fi
          fi
          python -m ops.coverage_gate --job core --coverage coverage.json --base-floor base-floor.txt

  web:
    # Next.js frontend: lint, types (incl. the generated API client) and a
    # production build. The OpenAPI snapshot itself is checked by the core job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types match web/openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    # Browser tests: start the API and the built web app, drive the real UI
    # and check that each control changes its output (web/e2e/).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Accounts live in the database (PLAN.md 1.4), so the browser tests need
    # one, as the deployed app has Neon
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # No Clerk instance in CI: the API accepts the development sign-in
      # (never in production, api/auth.py) and the web app offers it
      FSE_AUTH_DEV: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # A local Sentry DSN that e2e/monitoring.spec.ts intercepts: proves the
      # browser reports API failures with their request ID, without sending
      # anything to Sentry
      - run: npm run build
        working-directory: web
        env:
          SENTRY_DSN: http://e2e@localhost:3999/1
      - run: npx playwright test
        working-directory: web
        env:
          CI: "1"
          PYTHON: python
          E2E_SENTRY_DSN: http://e2e@localhost:3999/1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  ml:
    # Optional ML layer: runs the anomaly-detector and surrogate tests.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same database as the core job
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      FSE_REQUIRE_DB: "1"
      # As in core; this job fails on any skip, so it also proves the real
      # Upstash round trip ran
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # diff-cover compares with the base branch, so it needs the history
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # CPU-only torch first: the default Linux wheel pulls several GB of CUDA
      # libraries. requirements-ml.txt then sees torch already satisfied.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # requirements-dev.txt brings pytest and httpx (the FastAPI test client)
      - run: pip install -r requirements-ml.txt -r requirements-dev.txt
      # tests/test_backups.py dumps and restores a real database (PLAN.md 1.8).
      # pg_dump refuses a server newer than itself and the runner image ships
      # an older client, so install PGDG's newest, as backup.yml does.
      - name: Newest Postgres client, for the backup tests
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_dump --version
      - name: Run all tests, failing if any ML test skips
        # shell: bash adds pipefail, so a pytest failure isn't masked by tee
        shell: bash
        run: |
          pytest -rs --cov --cov-report= | tee pytest.log
          if grep -q SKIPPED pytest.log; then
            echo "::error::ML tests skipped -- dependencies or model files missing"
            exit 1
          fi
      # PLAN.md 0.3. This job runs every test, ML included, so it is the one
      # that checks changed lines: 80% of the Python lines a pull request
      # changes must be covered (ECC's figure). Tests, docs and web files
      # don't count; the web's proof is the browser tests.
      - name: Coverage against the floor, and of the changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          coverage json -q -o coverage.json
          { echo "<details><summary>Python coverage (ml): $(coverage report --format=total)%</summary>"; echo
            coverage report --format=markdown; echo; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          : > base-floor.txt
          if [ -n "$BASE_REF" ]; then
            git rev-parse --verify -q "origin/$BASE_REF" > /dev/null
            if [ -n "$(git ls-tree --name-only "origin/$BASE_REF" -- .coverage-floor)" ]; then
              git show "origin/$BASE_REF:.coverage-floor" > base-floor.txt
            fi
          fi
          status=0
          python -m ops.coverage_gate --job ml --coverage coverage.json --base-floor base-floor.txt || status=1
          if [ -n "$BASE_REF" ]; then
            coverage xml -q -o coverage.xml
            diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=80 \
              --markdown-report diff-cover.md || status=1
            cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

  docker:
    # The API image Render deploys (Dockerfile): build it, start it, and check
    # it serves real model output, not just a health check.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A database for the container, as Neon is for Render
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t fse-api .
      - name: Start the container on the port a host would assign
        run: |
          docker run -d --name api -e PORT=9100 -p 9100:9100 --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/postgres \
            -e FSE_AUTH_DEV=1 fse-api
      - name: Wait for the health check
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9100/api/health && exit 0
            sleep 2
          done
          docker logs api; exit 1
      - name: The image refuses anonymous calls (PLAN.md 1.4)
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' -X POST http://127.0.0.1:9100/api/deal/run \
            -H 'Content-Type: application/json' -d '{}')
          echo "anonymous /api/deal/run -> $code"; test "$code" = "401"
          ! grep -q irr body.json
      - name: Deal, Monte Carlo and export respond with model output
        env:
          AUTH: "Authorization: Bearer dev:ci"
        run: |
          irr=$(curl -fsS -X POST http://127.0.0.1:9100/api/deal/run -H "$AUTH" -H 'Content-Type: application/json' -d '{}' \
            | python3 -c "import sys, json; print(round(json.load(sys.stdin)['returns']['irr'], 4))")
          echo "default deal IRR $irr"; test "$irr" = "0.2116"
          curl -fsS -X POST http://127.0.0.1:9100/api/montecarlo/run -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"mc": {"n": 5000}, "seed": 1}' | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['n'] == 5000, d"
          curl -fsS -X POST http://127.0.0.1:9100/api/export/workbook -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"sheets": [{"name": "t", "columns": ["a"], "rows": [[1]]}]}' -o out.xlsx
          test "$(head -c 2 out.xlsx)" = "PK"
          docker inspect --format '{{.Config.User}}' api | grep -qx app
      - name: Request IDs come back and logs are JSON lines carrying them
        run: |
          curl -fsS -o /dev/null -D headers.txt -X POST http://127.0.0.1:9100/api/deal/run -H 'Authorization: Bearer dev:ci' -H 'Content-Type: application/json' -H 'X-Request-ID: docker-check-0001' -d '{}'
          grep -i '^x-request-id: docker-check-0001' headers.txt
          docker logs api 2>&1 | grep '"request_id": "docker-check-0001"' > logs.txt
          python3 -c "import json; lines = [json.loads(l) for l in open('logs.txt')]; req = next(l for l in lines if l['event'] == 'request'); assert any(l['event'] == 'model_run' for l in lines), lines; assert req['route'] == '/api/deal/run' and req['status'] == 200 and req['ts'].endswith('Z'), req; print(req)"
      - name: The image migrates its database on first use and reports storage
        run: |
          curl -fsS http://127.0.0.1:9100/api/health | python3 -c "import sys, json; d = json.load(sys.stdin)['database']; assert d['configured'] and d['status'] == 'unchecked', d"
          curl -fsS http://127.0.0.1:9100/api/health/database | tee db.json
          python3 -c "import json; d = json.load(open('db.json')); assert d['status'] == 'ok' and d['migrations']['status'] == 'current' and d['storage']['database_bytes'] > 0, d"
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -tAc "select count(*) from storage_checks" | grep -qx 1
      - name: A background job runs in the image and matches the direct run (PLAN.md 1.9)
        env:
          AUTH: "Authorization: Bearer dev:ci"
        run: |
          body='{"mc": {"n": 5000}, "seed": 7}'
          curl -fsS -X POST http://127.0.0.1:9100/api/montecarlo/run -H "$AUTH" -H 'Content-Type: application/json' -d "$body" > direct.json
          id=$(curl -fsS -X POST http://127.0.0.1:9100/api/jobs -H "$AUTH" -H 'Content-Type: application/json'             -d "{\"kind\": \"montecarlo.run\", \"input\": $body}" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          for i in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:9100/api/jobs/$id" -H "$AUTH" > job.json
            status=$(python3 -c "import json; print(json.load(open('job.json'))['status'])")
            echo "attempt $i: $status"
            [ "$status" = "queued" ] || [ "$status" = "running" ] || break
            sleep 1
          done
          python3 -c "import json; j = json.load(open('job.json')); d = json.load(open('direct.json')); assert j['status'] == 'succeeded', j; assert j['result']['summary'] == d['summary'], (j['result']['summary'], d['summary']); print(j['result']['summary'])"
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -tAc "select status from jobs where id = '$id'" | grep -qx succeeded
      - if: failure()
        run: docker logs api || true
