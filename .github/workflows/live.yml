name: live

# Read-only browser checks against the production site (web/e2e/live.spec.ts).
# Runs daily and on demand. Separate from `tests` so a sleeping or redeploying
# free-tier host never blocks a pull request. Staging has its own workflow
# (staging.yml), run after each push to the staging branch.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          E2E_LIVE: "1"
          E2E_EXPECT_ENV: production
      # Uptime monitors check that production is reachable; this catches a
      # site that is up but giving wrong answers (PLAN.md 1.2)
      - name: Alert if the live checks failed
        if: failure()
        working-directory: .
        env:
          BETTERSTACK_API_TOKEN: ${{ secrets.BETTERSTACK_API_TOKEN }}
        run: |
          python3 ops/betterstack.py incident --name "Production checks failed" --summary "Live browser checks failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
