name: live

# Read-only browser checks against the production site (web/e2e/live.spec.ts).
# Runs daily and on demand. Separate from `tests` so a sleeping or redeploying
# free-tier host never blocks a pull request. Staging has its own workflow
# (staging.yml), run after each push to the staging branch.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Neon production branch: reachable, migrations applied, storage under
      # 80% of the free 0.5 GB (PLAN.md 1.3). Once a day, so it doesn't keep
      # the compute awake.
      - name: Production database check
        id: database
        continue-on-error: true
        working-directory: .
        run: python3 ops/check_database.py https://fse-api.onrender.com
      # Usage counters shared through Upstash, which answers and is under
      # today's command budget (PLAN.md 1.6). PING only: not billed.
      - name: Production usage limits check
        id: limits
        continue-on-error: true
        working-directory: .
        run: |
          curl -fsS -m 120 https://fse-api.onrender.com/api/health/limits | tee limits.json; echo
          jq -e '.store == "upstash" and .upstash.reachable and (.upstash.over_budget | not)' limits.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          E2E_LIVE: "1"
          E2E_EXPECT_ENV: production
      # Uptime monitors check that production is reachable; this catches a
      # site that is up but giving wrong answers (PLAN.md 1.2)
      - name: Fail the run if the database or limits check failed
        if: steps.database.outcome == 'failure' || steps.limits.outcome == 'failure'
        run: exit 1
      - name: Alert if the live checks failed
        if: failure()
        working-directory: .
        env:
          BETTERSTACK_API_TOKEN: ${{ secrets.BETTERSTACK_API_TOKEN }}
        run: |
          python3 ops/betterstack.py incident --name "Production checks failed" --summary "Live checks failed (browser, database or usage limits): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
